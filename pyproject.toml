[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cnb-rates-pipeline"
version = "1.0.0"
description = "Datová pipeline kurzů ČNB: stažení, kontrola kvality, SQLite, statistiky a statický dashboard"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "playwright>=1.45"]

[project.scripts]
cnb-rates = "cnb_rates.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cnb_rates = ["site/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: testy dashboardu v prohlížeči (Playwright)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
